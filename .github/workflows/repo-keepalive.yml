name: Repo Keepalive

# GitHub 会在公开仓库 60 天无 activity 后自动禁用定时任务。
# 这个 workflow 每周提交一次时间戳，制造 activity 防止 keepalive.yml 被自动禁用。
on:
  schedule:
    - cron: '7 3 * * 1' # 每周一 03:07 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 更新保活时间戳
        run: |
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .keepalive-timestamp
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .keepalive-timestamp
          git diff --staged --quiet || git commit -m "chore: keepalive $(date -u +%F)"
          git push
