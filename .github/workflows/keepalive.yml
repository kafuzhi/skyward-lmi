name: Keep Codespace Alive

# 定时唤醒 + 手动触发两种模式
# 唤醒后：重建端口转发(public) + 重起守护(自动拉起 oc-bridge/下载站) + 端到端验证
on:
  schedule:
    # 每 6 小时一次，用随机分钟避开整点拥堵延迟
    - cron: '23 */6 * * *'
  workflow_dispatch: # 允许在 Actions 页面手动点"Run workflow"立即唤醒

concurrency:
  group: keepalive-codespace
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 唤醒 Codespace
        env:
          GH_TOKEN: ${{ secrets.CS_PAT }}
          CS: lmi-gateway-p7744v56g4jwh5gv
        run: |
          set -e
          echo "=== 当前状态 ==="
          STATE=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/user/codespaces/$CS" | jq -r '.state // "?"')
          echo "state=$STATE"

          if [ "$STATE" != "Available" ]; then
            echo "=== 调用 start 唤醒 ==="
            curl -s -o /dev/null -w "start HTTP:%{http_code}\n" -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/user/codespaces/$CS/start"
            for i in $(seq 1 30); do
              STATE=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/user/codespaces/$CS" | jq -r '.state // "?"')
              [ "$STATE" = "Available" ] && { echo "已就绪(第${i}次)"; break; }
              echo "等待中($i): $STATE"
              sleep 4
            done
          fi
          [ "$STATE" = "Available" ] || { echo "唤醒失败:$STATE"; exit 1; }

      - name: 重建服务守护 + 端口转发
        env:
          GH_TOKEN: ${{ secrets.CS_PAT }}
          CS: lmi-gateway-p7744v56g4jwh5gv
        run: |
          set -e
          echo "=== 重起守护(自动补 oc-bridge/下载站) ==="
          gh cs ssh -c "$CS" -- 'tmux has-session -t guard 2>/dev/null || tmux new-session -d -s guard "bash /home/codespace/keepalive.sh"' 2>&1 | tail -3
          sleep 8

          echo "=== 重建端口转发 ==="
          for P in "8080:18080" "8091:18091"; do
            timeout 12 gh cs ports forward "$P" -c "$CS" 2>&1 | head -1 || true
          done
          for P in 8080 8091; do
            gh cs ports visibility "${P}:public" -c "$CS" 2>&1 | head -1 || true
          done

          echo "=== 端口状态 ==="
          gh cs ports -c "$CS" --json sourcePort,visibility 2>&1

      - name: 端到端验证
        env:
          CS: lmi-gateway-p7744v56g4jwh5gv
        run: |
          sleep 5
          echo "=== 网站 ==="
          curl -s -o /dev/null -w "首页:%{http_code}\n" --max-time 20 "https://$CS-8080.app.github.dev/"
          echo "=== 网关 ==="
          curl -s -o /dev/null -w "models:%{http_code}\n" --max-time 20 "https://$CS-8091.app.github.dev/v1/models"
